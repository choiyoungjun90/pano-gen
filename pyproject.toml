[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panogen"
version = "0.1.0"
description = "Local 360° panorama generation (DiT360 on FLUX.1-dev) with seam-aware 8K upscaling"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.4",
    "diffusers>=0.36",
    "transformers>=4.52",
    "accelerate>=1.0",
    "peft>=0.15",
    "sentencepiece",
    "protobuf",
    "safetensors",
    "huggingface_hub>=0.30",
    "spandrel>=0.4",
    "psutil",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.45"]
mac = ["gguf>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
panogen = "panogen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
